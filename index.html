<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan de trabajo</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Router: no pinta ningún tablero. Solo resuelve sesión + membresía y redirige a
     toniylorete.html o captalia.html — así nadie sin acceso a Propelia llega a ver ese
     tablero ni un instante antes del redirect. -->
<div class="login-overlay" id="loginOverlay" hidden>
  <form class="login-modal" id="loginForm">
    <h2>Iniciar sesión</h2>
    <label class="lbl">Email</label>
    <input class="fld" type="email" id="loginEmail" required autocomplete="username">
    <label class="lbl">Contraseña</label>
    <input class="fld" type="password" id="loginPassword" required autocomplete="current-password">
    <div class="login-error" id="loginError" hidden></div>
    <button class="act pri" type="submit">Entrar</button>
  </form>
</div>

<script>
/* Config mínima: RoadmapSync solo la usa para valores por defecto de tablas que este
   router nunca toca (no lee/escribe roadmap_*/captalia_*, solo auth + app_miembros). */
window.APP_CONFIG = {};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="order-math.js"></script>
<script src="supabase-sync.js"></script>
<script>
(async function(){
  const loginOverlay = document.getElementById('loginOverlay');
  const loginForm    = document.getElementById('loginForm');
  const loginError   = document.getElementById('loginError');
  const loginEmail   = document.getElementById('loginEmail');
  const loginPassword= document.getElementById('loginPassword');

  async function redirigirSegunMembresia(){
    let proyectos = [];
    try{ proyectos = await RoadmapSync.misProyectos(); }catch(e){}
    location.replace(proyectos.includes('propelia') ? 'toniylorete.html' : 'captalia.html');
  }

  let activa = false;
  try{ activa = await RoadmapSync.sesionActiva(); }catch(e){}
  if(activa){ await redirigirSegunMembresia(); return; }

  loginOverlay.hidden = false;
  loginForm.addEventListener('submit', async e => {
    e.preventDefault();
    loginError.hidden = true;
    const btn = loginForm.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Entrando...';
    try{
      await RoadmapSync.iniciarSesion(loginEmail.value.trim(), loginPassword.value);
      await redirigirSegunMembresia();
    }catch(err){
      btn.disabled = false; btn.textContent = 'Entrar';
      loginError.textContent = 'Email o contraseña incorrectos.';
      loginError.hidden = false;
    }
  });
})();
</script>
</body>
</html>
