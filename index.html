<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan de trabajo CRM · Loro &amp; Toni</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#151C26; --ink-2:#414D5C; --muted:#7A8595; --faint:#9AA4B2;
  --canvas:#F2F4F7; --surface:#FFFFFF; --sunken:#F7F9FB;
  --edge:#DCE2EA; --edge-soft:#EAEEF3; --edge-hard:#C4CDD8;
  --loro:#2E7A51; --loro-soft:#F1F8F4;
  --toni:#2B5FA8; --toni-soft:#F1F6FC;
  --warn:#96590A; --warn-soft:#FDF8EE;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --barh:57px; --r:8px;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.55 var(--sans);padding:0 0 70px}
.wrap{max-width:1140px;margin:0 auto;padding:0 18px}
.lbl{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* ---------- cabecera ---------- */
header{background:var(--ink);color:#fff;padding:20px 0 18px}
.htop{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:18px;font-weight:650;letter-spacing:-.2px}
h1 span{color:#8C99AB;font-weight:400}
.trello{font:600 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  color:#A9B7C9;text-decoration:none;border-bottom:1px solid #3D4859;padding-bottom:3px}
.trello:hover{color:#fff;border-color:#fff}
.cancha{margin-top:17px}
.cancha-lbl{display:flex;justify-content:space-between;font:600 10px/1 var(--mono);
  letter-spacing:.12em;text-transform:uppercase;color:#8C99AB;margin-bottom:7px}
.cancha-lbl b{font:700 13px/1 var(--sans);letter-spacing:0}
.cl-loro b{color:#6FC194}.cl-toni b{color:#8FB6EE}
.court{display:flex;height:8px;border-radius:99px;overflow:hidden;background:#28313E}
.court i{display:block;transition:flex-grow .45s cubic-bezier(.4,0,.2,1)}
.court .c-loro{background:#3E9A67}.court .c-toni{background:#3B72C4}.court .c-none{background:#39424F}
.cancha-note{margin:9px 0 0;font-size:12.5px;color:#8C99AB}

/* ---------- barra ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(242,244,247,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--edge);padding:10px 0}
.bar-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:2px;background:var(--surface);border:1px solid var(--edge);
  border-radius:var(--r);padding:3px}
.chip{border:0;background:transparent;font:600 12.5px/1 var(--sans);color:var(--ink-2);
  padding:7px 11px;border-radius:5px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chip:hover{background:var(--canvas)}
.chip[aria-pressed=true]{background:#EDF1F6;color:var(--ink);box-shadow:inset 0 0 0 1px var(--edge)}
.dot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--faint)}
.dot.l{background:var(--loro)}.dot.t{background:var(--toni)}
.search{flex:1;min-width:180px;border:1px solid var(--edge);border-radius:var(--r);
  padding:9px 12px;font:14px var(--sans);background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--faint)}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);
  padding:8px 11px;cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{margin:0;accent-color:var(--ink-2)}
.mini{border:1px solid var(--edge);background:var(--surface);color:var(--ink-2);
  font:600 12.5px var(--sans);padding:8px 11px;border-radius:var(--r);cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--edge-hard);color:var(--ink)}
.count{font:600 11.5px/1 var(--mono);color:var(--faint);white-space:nowrap;padding:0 2px}
.estado-guardado{font:600 11px var(--mono);color:var(--faint);white-space:nowrap}
.estado-guardado.cargando{color:var(--ink-2)}
.estado-guardado.ok{color:#2E7D32}

/* ---------- bloques ---------- */
.sec{margin-top:26px}
.sec:first-child{margin-top:20px}
.sec-h{position:sticky;top:var(--barh);z-index:20;display:flex;align-items:center;gap:10px;
  background:var(--surface);border:1px solid var(--edge);border-left:3px solid var(--ink);
  border-radius:var(--r);padding:11px 12px}
.caret{flex:none;width:18px;height:18px;border:0;background:transparent;cursor:pointer;
  color:var(--faint);font-size:10px;padding:0;transition:transform .18s;font-family:var(--mono)}
.sec.open>.sec-h .caret{transform:rotate(90deg)}
.sec-name{flex:1;min-width:60px;border:1px solid transparent;background:transparent;
  font:650 13.5px/1.35 var(--sans);color:var(--ink);letter-spacing:-.1px;
  padding:5px 7px;border-radius:5px;width:100%}
.sec-name:hover{border-color:var(--edge)}
.sec-name:focus{border-color:var(--edge-hard);background:var(--sunken);outline:none}
.sec-tools{display:flex;align-items:center;gap:3px;opacity:0;transition:opacity .15s}
.sec-h:hover .sec-tools,.sec-h:focus-within .sec-tools,.sec.menu-open .sec-tools{opacity:1}
.tool{width:26px;height:26px;border:1px solid transparent;background:transparent;border-radius:5px;
  cursor:pointer;color:var(--muted);font-size:12px;line-height:1;padding:0;font-family:var(--sans)}
.tool:hover{background:var(--canvas);border-color:var(--edge);color:var(--ink)}
/* ---------- asa de arrastre ---------- */
.grip{flex:none;width:16px;height:24px;border:0;background:transparent;padding:0;
  display:flex;align-items:center;justify-content:center;color:var(--edge-hard);
  cursor:grab;opacity:0;transition:opacity .15s;touch-action:none}
.grip:active{cursor:grabbing}
.grip svg{display:block;fill:currentColor}
.sec-h:hover .grip,.row:hover .grip,.grip:focus-visible{opacity:1}
.grip[aria-disabled=true]{cursor:not-allowed}
.dragging{opacity:.38}
.row,.sec{position:relative}
.row.dz-a::after,.row.dz-b::after,.sec.dz-a::after,.sec.dz-b::after{
  content:'';position:absolute;left:0;right:0;height:3px;background:var(--toni);
  border-radius:2px;z-index:25;pointer-events:none}
.row.dz-a::after,.sec.dz-a::after{top:-3px}
.row.dz-b::after,.sec.dz-b::after{bottom:-3px}
.sec-h.dz-in,.sec-body.dz-in{box-shadow:inset 0 0 0 2px var(--toni)}
.sec-body.dz-in{border-radius:6px}

/* ---------- menú de tres puntos ---------- */
.menu-wrap{position:relative;display:flex}
.menu{position:absolute;top:30px;right:0;z-index:40;min-width:172px;background:var(--surface);
  border:1px solid var(--edge);border-radius:7px;padding:5px;
  box-shadow:0 10px 28px rgba(21,28,38,.16)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;
  font:500 13px var(--sans);color:var(--ink);padding:8px 10px;border-radius:5px;cursor:pointer}
.menu button:hover{background:var(--sunken)}
.menu button:disabled{color:var(--faint);cursor:default;background:transparent}
.menu hr{border:0;border-top:1px solid var(--edge-soft);margin:5px 2px}
.menu button.peligro{color:#9E3131}
.menu button.peligro:hover{background:#FCF4F4}

.pill{flex:none;font:600 11px/1 var(--mono);padding:5px 8px;border-radius:5px;
  background:var(--sunken);color:var(--muted);border:1px solid var(--edge-soft);white-space:nowrap}
.sec-body{display:none;margin:6px 0 0 11px;padding-left:14px;border-left:2px solid var(--edge-soft)}
.sec.open>.sec-body{display:block}
.addrow{width:100%;margin-top:4px;border:1px dashed var(--edge);background:transparent;
  color:var(--muted);font:600 12.5px var(--sans);padding:9px;border-radius:var(--r);cursor:pointer;text-align:left}
.addrow:hover{border-color:var(--edge-hard);color:var(--ink);background:var(--surface)}

/* ---------- filas ---------- */
.row{background:var(--surface);border:1px solid var(--edge-soft);
  border-left:3px solid var(--edge-hard);border-radius:var(--r);margin-bottom:4px}
.row[data-resp=Loro]{border-left-color:var(--loro)}
.row[data-resp=Toni]{border-left-color:var(--toni)}
.row[data-estado=Hecho]{border-left-color:var(--edge);background:var(--sunken)}
.row[data-estado=Hecho] .r-t{text-decoration:line-through;color:var(--faint)}
.row:hover{border-top-color:var(--edge);border-right-color:var(--edge);border-bottom-color:var(--edge)}
.row.open{margin:10px 0;box-shadow:0 2px 10px rgba(21,28,38,.07);
  border-top-color:var(--edge-hard);border-right-color:var(--edge-hard);border-bottom-color:var(--edge-hard)}
.r-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.r-head .caret{transition:transform .18s}
.row.open .r-head .caret{transform:rotate(90deg)}
.r-id{flex:none;font:600 10px/1 var(--mono);color:var(--faint);width:29px}
.r-t{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-t.vacio{color:var(--faint);font-weight:400;font-style:italic}
.seg{flex:none;display:flex;gap:2px;background:var(--sunken);border:1px solid var(--edge-soft);
  border-radius:6px;padding:2px}
.seg button{display:flex;align-items:center;gap:6px;border:0;background:transparent;
  font:600 11.5px/1 var(--sans);color:var(--muted);padding:6px 9px;border-radius:4px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);box-shadow:0 1px 2px rgba(21,28,38,.09)}
.seg button[data-r=Loro][aria-pressed=true]{color:var(--loro)}
.seg button[data-r=Toni][aria-pressed=true]{color:var(--toni)}
select.est{flex:none;border:1px solid var(--edge-soft);border-radius:6px;padding:6px 7px;
  font:600 11.5px var(--sans);background:var(--sunken);color:var(--ink-2);cursor:pointer}
.row[data-estado=Bloqueado] select.est{color:var(--warn);background:var(--warn-soft);border-color:#EBDCBE}
.flag{flex:none;font-size:12px}

/* ---------- panel desplegado (sangrado) ---------- */
.r-body{display:none;margin:0 12px 12px 41px;padding:14px 16px;
  background:var(--sunken);border:1px solid var(--edge-soft);border-radius:6px}
.row.open .r-body{display:block}
.row[data-resp=Loro].open .r-body{background:var(--loro-soft)}
.row[data-resp=Toni].open .r-body{background:var(--toni-soft)}
.grp{margin-bottom:12px}
.grp:last-child{margin-bottom:0}
.grp>label{display:block;margin-bottom:5px}
.fld{width:100%;border:1px solid var(--edge);border-radius:6px;padding:9px 11px;
  font:14px/1.6 var(--sans);background:var(--surface);color:var(--ink);resize:none;
  font-family:var(--sans)}
.fld:hover{border-color:var(--edge-hard)}
textarea.fld{overflow:hidden;min-height:44px}
textarea.expl{line-height:1.65}
.trio{display:grid;grid-template-columns:1fr 200px 148px;gap:10px}
.duo{display:grid;grid-template-columns:1fr 220px;gap:10px}
.duo2{display:grid;grid-template-columns:1fr 200px;gap:10px}
.zona{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border:1px dashed var(--edge);
  border-radius:6px;padding:10px 12px;background:var(--surface);transition:border-color .15s,background .15s}
.zona.drag{border-color:var(--toni);background:var(--toni-soft);border-style:solid}
.zona-txt{font-size:12.5px;color:var(--muted)}
.zona kbd{font:600 10.5px var(--mono);background:var(--sunken);border:1px solid var(--edge);
  border-radius:4px;padding:1px 4px;color:var(--ink-2)}
.mini2{border:1px solid var(--edge);background:var(--sunken);color:var(--ink);
  font:600 12px var(--sans);padding:7px 11px;border-radius:5px;cursor:pointer}
.mini2:hover{border-color:var(--edge-hard);background:var(--surface)}
.enl{margin-top:7px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}
.thumbs:empty{display:none}
.th{position:relative;width:106px;border:1px solid var(--edge);border-radius:6px;
  overflow:hidden;background:var(--surface)}
.th img{display:block;width:100%;height:70px;object-fit:cover;cursor:zoom-in;background:var(--sunken)}
.th .nom{font:11px/1.35 var(--sans);padding:5px 6px;color:var(--ink-2);
  word-break:break-word;max-height:33px;overflow:hidden}
.th .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:99px;border:0;
  background:rgba(21,28,38,.7);color:#fff;font-size:11px;line-height:20px;padding:0;
  cursor:pointer;opacity:0;transition:opacity .15s}
.th:hover .x,.th:focus-within .x{opacity:1}
.th .x.armar{opacity:1;background:#9E3131}
.th.doc{width:140px;padding:10px;cursor:pointer}
.th.doc .ico{font-size:17px}
.th.doc:hover{border-color:var(--edge-hard)}
.th .kb{font:600 10px var(--mono);color:var(--faint);padding:0 6px 5px}
.peso{font:600 11px/1 var(--mono);color:var(--faint)}
.aviso{margin-bottom:13px;padding:11px 13px;border-radius:6px;background:var(--warn-soft);
  border:1px solid #EBDCBE;color:#6E4207;font-size:13px}
.esq-bloque{border:1px solid var(--edge);border-radius:8px;padding:14px;
  display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.esq-cab{height:20px;width:40%;border-radius:4px}
.esq-fila{height:15px;border-radius:4px}
.shimmer{background:linear-gradient(90deg,var(--sunken) 25%,var(--edge) 37%,var(--sunken) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.link{display:inline-block;margin-top:5px;font-size:12px;color:var(--toni);word-break:break-all}
.r-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:13px;padding-top:11px;border-top:1px solid var(--edge-soft);flex-wrap:wrap}
.mover{display:flex;align-items:center;gap:7px}
.mover select{border:1px solid var(--edge);border-radius:6px;padding:7px 8px;
  font:13px var(--sans);background:var(--surface);color:var(--ink-2);max-width:280px}
.del{border:1px solid transparent;background:transparent;color:var(--muted);
  font:600 12px var(--sans);padding:7px 10px;border-radius:6px;cursor:pointer}
.del:hover{color:#9E3131;border-color:#E8CACA;background:#FCF4F4}

/* ---------- pie ---------- */
.acts{margin-top:30px;background:var(--surface);border:1px solid var(--edge);
  border-radius:var(--r);padding:17px}
.acts h2{margin:0 0 5px;font:600 10px/1 var(--mono);letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted)}
.acts p{margin:0 0 14px;font-size:13.5px;color:var(--ink-2);max-width:76ch}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button.act{border:1px solid var(--edge);background:var(--surface);color:var(--ink);
  font:600 13px var(--sans);padding:10px 14px;border-radius:6px;cursor:pointer}
button.act:hover{border-color:var(--edge-hard);background:var(--sunken)}
button.act.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.act.pri:hover{background:#000}
.newsec{margin-top:14px;width:100%;border:1px dashed var(--edge);background:transparent;
  color:var(--muted);font:600 13px var(--sans);padding:13px;border-radius:var(--r);cursor:pointer}
.newsec:hover{border-color:var(--edge-hard);color:var(--ink);background:var(--surface)}
.empty{background:var(--surface);border:1px dashed var(--edge);border-radius:var(--r);
  padding:28px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);
  background:var(--ink);color:#fff;padding:11px 17px;border-radius:8px;font-size:13.5px;
  z-index:60;transition:transform .3s;box-shadow:0 8px 26px rgba(0,0,0,.2)}
.toast.on{transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--toni);outline-offset:2px}
@media (max-width:900px){
  .trio,.duo,.duo2{grid-template-columns:1fr}
  .r-body{margin-left:12px;padding:12px}
  .r-head{flex-wrap:wrap}
  .r-t{flex-basis:100%;order:-1;white-space:normal}
  .sec-tools,.grip{opacity:1}
  .sec-h{position:static;flex-wrap:wrap}
  .sec-name{flex-basis:100%;order:-1}
  .chips{flex-wrap:wrap}
  .mover{flex-wrap:wrap;min-width:0}
  .mover select{max-width:100%;width:100%}
  .r-foot{align-items:stretch}
  .pill{margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .bar,.acts,.newsec,.addrow,.sec-tools,.grip,.seg,select.est,.r-foot,header .cancha{display:none}
  .sec-h,.sec-body,.r-body{position:static!important;display:block!important}
  body{background:#fff}.row.open{box-shadow:none}
}
.login-overlay{position:fixed;inset:0;z-index:200;background:rgba(21,28,38,.55);
  display:flex;align-items:center;justify-content:center;padding:18px}
.login-overlay[hidden]{display:none}
.login-modal{background:var(--surface);border:1px solid var(--edge);border-radius:10px;
  padding:24px;width:100%;max-width:320px;box-shadow:0 20px 50px rgba(21,28,38,.3)}
.login-modal h2{margin:0 0 16px;font-size:16px}
.login-modal .lbl{margin:12px 0 5px}
.login-error{margin-top:10px;color:#9E3131;font-size:12.5px}
.login-error[hidden]{display:none}
.login-modal button{margin-top:16px;width:100%}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <h1>Plan de trabajo CRM <span>· Loro &amp; Toni</span></h1>
      <a class="trello" href="https://trello.com/b/vlKCxRTS/propelia" target="_blank" rel="noopener">Tablero de Trello</a>
      <button class="trello" id="bCerrarSesion" style="border:0;background:transparent;cursor:pointer;font:inherit">Cerrar sesión</button>
    </div>
    <div class="cancha">
      <div class="cancha-lbl">
        <span class="cl-loro">Loro <b id="nLoro">0</b></span>
        <span class="cl-toni"><b id="nToni">0</b> Toni</span>
      </div>
      <div class="court"><i class="c-loro"></i><i class="c-none"></i><i class="c-toni"></i></div>
      <p class="cancha-note" id="nota"></p>
    </div>
  </div>
</header>

<div class="bar"><div class="wrap bar-in">
  <div class="chips" role="group" aria-label="Filtrar por responsable">
    <button class="chip" data-f="todas" aria-pressed="true">Todas</button>
    <button class="chip" data-f="Loro" aria-pressed="false"><i class="dot l"></i>Lo mío</button>
    <button class="chip" data-f="Toni" aria-pressed="false"><i class="dot t"></i>Lo de Toni</button>
    <button class="chip" data-f="sin" aria-pressed="false"><i class="dot"></i>Sin asignar</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Buscar en títulos, módulos y explicaciones…   ( / )">
  <label class="toggle"><input type="checkbox" id="oh"> Ocultar hechas</label>
  <button class="mini" id="bPlegar">Plegar todo</button>
  <span class="count" id="visibles"></span>
  <span class="estado-guardado" id="estadoGuardado" aria-live="polite"></span>
</div></div>

<main class="wrap">
  <div id="lista"><div class="esqueleto" aria-hidden="true">
    <div class="esq-bloque">
      <div class="esq-cab shimmer"></div>
      <div class="esq-fila shimmer"></div>
      <div class="esq-fila shimmer"></div>
      <div class="esq-fila shimmer" style="width:70%"></div>
    </div>
    <div class="esq-bloque">
      <div class="esq-cab shimmer"></div>
      <div class="esq-fila shimmer"></div>
      <div class="esq-fila shimmer" style="width:60%"></div>
    </div>
  </div></div>
  <button class="newsec" id="bNuevoBloque">+  Nuevo bloque</button>

  <div class="acts">
    <h2>Respaldo</h2>
    <p>Los cambios ya se sincronizan solos entre vos y Toni. Estos botones son solo para guardar
       una copia de respaldo puntual, no hace falta usarlos para compartir nada.</p>
    <div class="btns">
      <button class="act pri" id="bHtml">Guardar archivo</button>
      <button class="act" id="bCsv">Exportar a CSV</button>
    </div>
  </div>
</main>

<div class="login-overlay" id="loginOverlay" hidden>
  <form class="login-modal" id="loginForm">
    <h2>Iniciar sesión</h2>
    <label class="lbl">Email</label>
    <input class="fld" type="email" id="loginEmail" required autocomplete="username">
    <label class="lbl">Contraseña</label>
    <input class="fld" type="password" id="loginPassword" required autocomplete="current-password">
    <div class="login-error" id="loginError" hidden></div>
    <button class="act pri" type="submit">Entrar</button>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script id="datos" type="application/json">{"secciones":[],"tareas":[]}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="order-math.js"></script>
<script src="supabase-sync.js"></script>
<script>
const ESTADOS = ['Pendiente','En curso','Bloqueado','Hecho'];

let estado = { secciones: [], tareas: [] };

const pendientesGuardado = new Map();
function guardarDebounced(clave, fn) {
  clearTimeout(pendientesGuardado.get(clave));
  pendientesGuardado.set(clave, setTimeout(() => { pendientesGuardado.delete(clave); fn(); }, 500));
}
const valoresAntesDelCambio = new Map();
const pendientesEnVuelo = new Map();

async function conEstadoDeCarga(accion, { revertir, intentos = 2, onEstado } = {}) {
  onEstado?.('cargando');
  for (let intento = 0; intento <= intentos; intento++) {
    try { await accion(); onEstado?.('ok'); return true; }
    catch (e) {
      if (intento === intentos) {
        onEstado?.('error');
        revertir?.();
        aviso('No se pudo completar la acción. Revisa tu conexión.');
        return false;
      }
      await new Promise(r => setTimeout(r, 1500));
    }
  }
}
function onEstadoBoton(btn, textoCargando) {
  const original = btn.textContent;
  return estado => {
    btn.disabled = estado === 'cargando';
    btn.textContent = estado === 'cargando' ? textoCargando : original;
  };
}
const combinar = (...fns) => estado => fns.forEach(fn => fn(estado));

let enVuelo = 0;
const elGuardado = document.getElementById('estadoGuardado');
function onEstadoGlobal(estado) {
  if (estado === 'cargando') {
    enVuelo++;
    elGuardado.className = 'estado-guardado cargando';
    elGuardado.textContent = '● guardando';
    return;
  }
  enVuelo = Math.max(0, enVuelo - 1);
  if (enVuelo > 0) return;
  elGuardado.className = 'estado-guardado' + (estado === 'ok' ? ' ok' : '');
  elGuardado.textContent = estado === 'ok' ? '✓ guardado' : '';
  if (estado === 'ok') setTimeout(() => {
    if (enVuelo === 0) { elGuardado.textContent = ''; elGuardado.className = 'estado-guardado'; }
  }, 1500);
}

async function persistirTarea(t, { onEstado = onEstadoGlobal, revertir, intentos = 2 } = {}) {
  return conEstadoDeCarga(() => RoadmapSync.guardarTarea(t), { onEstado, revertir, intentos });
}
async function persistirSeccion(s, { onEstado = onEstadoGlobal, revertir, intentos = 2 } = {}) {
  return conEstadoDeCarga(() => RoadmapSync.guardarSeccion(s), { onEstado, revertir, intentos });
}

let refrescoPendiente = false;
async function refrescarDesdeSupabase() {
  const enFoco = document.activeElement;
  const escribiendo = enFoco && lista.contains(enFoco) && (enFoco.tagName === 'INPUT' || enFoco.tagName === 'TEXTAREA');
  if (escribiendo) { refrescoPendiente = true; return; }
  try { estado = await RoadmapSync.cargarEstado(); }
  catch (e) { aviso('No se pudo sincronizar: ' + e.message); return; }
  render();
}
document.addEventListener('focusout', e => {
  if (refrescoPendiente && lista.contains(e.target)) {
    refrescoPendiente = false;
    refrescarDesdeSupabase();
  }
});

/* ---------- archivos ---------- */
const MAX_LADO=1800, CALIDAD=.82, MAX_ARCHIVO=6*1048576;
const kb=n=>n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB';

async function comprimirImagen(file){
  try{
    const bmp=await createImageBitmap(file);
    const f=Math.min(1, MAX_LADO/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*f), h=Math.round(bmp.height*f);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(bmp,0,0,w,h);
    if(bmp.close) bmp.close();
    const blob = await new Promise(resolve=>c.toBlob(resolve,'image/webp',CALIDAD));
    return (blob && blob.size<file.size) ? blob : file;
  }catch(e){ return file; }
}
async function adjuntar(t, files, alTerminar){
  let n=0, saltados=[], ahorro=0, subidos=[];
  onEstadoGlobal('cargando');
  for(const f of files){
    const esImg=/^image\//.test(f.type);
    if(!esImg && f.size>MAX_ARCHIVO){ saltados.push(f.name+' ('+kb(f.size)+')'); continue; }
    const blob = esImg ? await comprimirImagen(f) : f;
    if(blob.size>MAX_ARCHIVO){ saltados.push((f.name||'captura')+' ('+kb(blob.size)+' ya comprimida)'); continue; }
    if(esImg && f.size>blob.size) ahorro += f.size-blob.size;
    try{
      const nombre = f.name || ('captura-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.webp');
      const archivo = await RoadmapSync.subirArchivo(t.id, blob, nombre);
      t.files.push(archivo); subidos.push(archivo);
      n++;
    }catch(e){ saltados.push((f.name||'captura')+' (error al subir)'); }
  }
  if(n){
    await persistirTarea(t, {
      onEstado: estado => { if (estado !== 'cargando') onEstadoGlobal(estado); },
      revertir: () => {
        subidos.forEach(a => {
          const i=t.files.indexOf(a); if(i>-1) t.files.splice(i,1);
          RoadmapSync.borrarArchivo(a.path).catch(()=>{});
        });
        alTerminar();
      },
    });
  } else {
    onEstadoGlobal('ok');
  }
  alTerminar();
  if(saltados.length) aviso('No pude adjuntar: '+saltados.join(', ')+'. Súbelo a Drive y pega el enlace.');
  else if(n) aviso((n===1?'1 archivo adjuntado':n+' archivos adjuntados')+(ahorro>512000?' · '+kb(ahorro)+' ahorrados al comprimir':''));
}
function abrirArchivo(f, descargar){
  const url = RoadmapSync.urlPublica(f.path);
  const a=document.createElement('a'); a.href=url;
  if(descargar) a.download=f.n; else { a.target='_blank'; a.rel='noopener'; }
  a.click();
}
function pintarThumbs(t, cont){
  cont.innerHTML='';
  (t.files||[]).forEach((f,i)=>{
    const esImg=/^image\//.test(f.t);
    const box=document.createElement('div');
    box.className='th'+(esImg?'':' doc');
    const url = RoadmapSync.urlPublica(f.path);
    if(esImg){
      const im=document.createElement('img');
      im.src=url; im.alt=f.n; im.title='Abrir '+f.n;
      im.onclick=()=>abrirArchivo(f,false);
      box.appendChild(im);
    }else{
      const ic=document.createElement('div'); ic.className='ico'; ic.textContent='📄';
      box.appendChild(ic);
      box.title='Descargar '+f.n;
      box.onclick=e=>{ if(!e.target.closest('.x')) abrirArchivo(f,true); };
    }
    const nm=document.createElement('div'); nm.className='nom'; nm.textContent=f.n;
    box.appendChild(nm);
    const pz=document.createElement('div'); pz.className='kb'; pz.textContent=kb(f.size||0);
    box.appendChild(pz);
    const x=document.createElement('button');
    x.className='x'; x.type='button'; x.textContent='✕';
    x.title='Quitar este archivo'; x.setAttribute('aria-label','Quitar '+f.n);
    let armarTimeout=null;
    x.onclick=async ev=>{
      ev.stopPropagation();
      if(!x.classList.contains('armar')){
        x.classList.add('armar');
        x.title='Click de nuevo para confirmar el borrado';
        armarTimeout=setTimeout(()=>{ x.classList.remove('armar'); x.title='Quitar este archivo'; }, 3000);
        return;
      }
      clearTimeout(armarTimeout);
      const idx=t.files.indexOf(f);
      const [quitado]=t.files.splice(idx,1);
      pintarThumbs(t,cont);
      await persistirTarea(t, {
        revertir: () => { t.files.splice(idx,0,quitado); pintarThumbs(t,cont); },
      });
      try{ await RoadmapSync.borrarArchivo(quitado.path); }catch(e){}
    };
    box.appendChild(x);
    cont.appendChild(box);
  });
}

const abiertas = new Set();
const cerradas = new Set();
const filtros = {resp:'todas', q:'', ocultarHechas:false};

function nuevoId(pref, lista){
  let n=1; const usados=new Set(lista);
  while(usados.has(pref+String(n).padStart(2,'0'))) n++;
  return pref+String(n).padStart(2,'0');
}
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const escA = s => esc(s).replace(/"/g,'&quot;');

const GRIP='<svg viewBox="0 0 10 16" width="10" height="16" aria-hidden="true">'+
  [4,8,12].map(y=>`<circle cx="3" cy="${y}" r="1.35"/><circle cx="7" cy="${y}" r="1.35"/>`).join('')+'</svg>';

let arrastre=null;
const filtrando=()=>filtros.resp!=='todas'||!!filtros.q||filtros.ocultarHechas;
function limpiarZonas(){
  document.querySelectorAll('.dz-a,.dz-b,.dz-in').forEach(e=>e.classList.remove('dz-a','dz-b','dz-in'));
}
const llevaArchivos=e=>[...(e.dataTransfer?.types||[])].includes('Files');

function asa(el, tipo, id, titulo){
  const g=document.createElement('button');
  g.className='grip'; g.type='button'; g.innerHTML=GRIP;
  g.title=titulo; g.setAttribute('aria-label',titulo);
  g.addEventListener('mousedown',()=>{ el.draggable=true; });
  g.addEventListener('touchstart',()=>{ el.draggable=true; },{passive:true});
  ['mouseup','touchend'].forEach(n=>document.addEventListener(n,()=>{ el.draggable=false; }));
  g.onclick=ev=>ev.stopPropagation();
  el.addEventListener('dragstart',e=>{
    if(!el.draggable) return;
    if(filtrando()){ e.preventDefault(); el.draggable=false; aviso('Quita el filtro y la búsqueda para poder reordenar.'); return; }
    arrastre={tipo,id};
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain', id);
    setTimeout(()=>el.classList.add('dragging'),0);
  });
  el.addEventListener('dragend',()=>{
    el.classList.remove('dragging'); el.draggable=false; arrastre=null; limpiarZonas();
  });
  return g;
}

function moverTarea(idA, idObj, despues){
  const a=estado.tareas;
  const i=a.findIndex(t=>t.id===idA); if(i<0||idA===idObj) return;
  const [t]=a.splice(i,1);
  const j=a.findIndex(x=>x.id===idObj);
  if(j<0){ a.splice(i,0,t); return; }
  const secAnterior=t.sec, ordenAnterior=t.orden;
  t.sec=a[j].sec;
  const destino=despues?j+1:j;
  a.splice(destino,0,t);
  const anterior=a[destino-1]?.orden ?? null;
  const siguiente=a[destino+1]?.orden ?? null;
  t.orden=RoadmapSync.calcularOrden(anterior, siguiente);
  persistirTarea(t, { revertir: () => { t.sec=secAnterior; t.orden=ordenAnterior; render(); } });
  render();
}
function moverTareaAlFinal(idA, secId){
  const a=estado.tareas;
  const i=a.findIndex(t=>t.id===idA); if(i<0) return;
  const [t]=a.splice(i,1);
  const secAnterior=t.sec, ordenAnterior=t.orden;
  t.sec=secId;
  let ultimo=-1; a.forEach((x,k)=>{ if(x.sec===secId) ultimo=k; });
  a.splice(ultimo+1,0,t);
  t.orden=RoadmapSync.calcularOrden(a[ultimo]?.orden ?? null, null);
  persistirTarea(t, { revertir: () => { t.sec=secAnterior; t.orden=ordenAnterior; render(); } });
  render();
}
function moverBloque(idA, idObj, despues){
  const a=estado.secciones;
  const i=a.findIndex(x=>x.id===idA); if(i<0||idA===idObj) return;
  const [s]=a.splice(i,1);
  const j=a.findIndex(x=>x.id===idObj);
  if(j<0){ a.splice(i,0,s); return; }
  const ordenAnterior=s.orden;
  const destino=despues?j+1:j;
  a.splice(destino,0,s);
  const anterior=a[destino-1]?.orden ?? null;
  const siguiente=a[destino+1]?.orden ?? null;
  s.orden=RoadmapSync.calcularOrden(anterior, siguiente);
  persistirSeccion(s, { revertir: () => { s.orden=ordenAnterior; render(); } });
  render();
}
function moverBloquePaso(id, paso){
  const a=estado.secciones, i=a.findIndex(x=>x.id===id), j=i+paso;
  if(i<0||j<0||j>=a.length) return;
  [a[i],a[j]]=[a[j],a[i]];
  const s=a[j];
  const anterior=a[j-1]?.orden ?? null;
  const siguiente=a[j+1]?.orden ?? null;
  s.orden=RoadmapSync.calcularOrden(anterior, siguiente);
  persistirSeccion(s); render();
}

function visible(t){
  if(filtros.resp==='sin'){ if(t.resp) return false; }
  else if(filtros.resp!=='todas' && t.resp!==filtros.resp) return false;
  if(filtros.ocultarHechas && t.estado==='Hecho') return false;
  if(filtros.q){
    const h=(t.tarea+' '+t.modulo+' '+t.expl+' '+t.com+' '+t.id).toLowerCase();
    if(!h.includes(filtros.q)) return false;
  }
  return true;
}

function cancha(){
  const act = t=>t.estado!=='Hecho';
  const l=estado.tareas.filter(t=>t.resp==='Loro'&&act(t)).length;
  const n=estado.tareas.filter(t=>t.resp==='Toni'&&act(t)).length;
  const s=estado.tareas.filter(t=>!t.resp&&act(t)).length;
  const h=estado.tareas.filter(t=>t.estado==='Hecho').length;
  nLoro.textContent=l; nToni.textContent=n;
  const tot=Math.max(l+n+s,1);
  document.querySelector('.c-loro').style.flexGrow=l/tot;
  document.querySelector('.c-none').style.flexGrow=s/tot;
  document.querySelector('.c-toni').style.flexGrow=n/tot;
  nota.textContent=(s?s+' sin asignar · ':'')+h+' hechas de '+estado.tareas.length;
}

function autosize(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }

function pintarFila(t){
  const row=document.createElement('article');
  row.className='row'+(abiertas.has(t.id)?' open':'');
  row.dataset.resp=t.resp||''; row.dataset.estado=t.estado; row.dataset.id=t.id;
  const roja=(t.com||'').includes('🔴');
  const opciones=estado.secciones.map(s=>
    `<option value="${s.id}" ${s.id===t.sec?'selected':''}>${esc(s.titulo.slice(0,58))}</option>`).join('');
  row.innerHTML=`
   <div class="r-head">
     <span class="grip-slot"></span>
     <button class="caret" aria-label="Abrir o cerrar">&#9654;</button>
     <span class="r-id">${t.id}</span>
     <div class="r-t${t.tarea?'':' vacio'}">${esc(t.tarea)||'Tarea sin título — ábrela y ponle nombre'}</div>
     ${roja?'<span class="flag" title="Nota marcada para Loro">🔴</span>':''}
     <div class="seg">
       <button data-r="Loro" aria-pressed="${t.resp==='Loro'}"><i class="dot l"></i>Loro</button>
       <button data-r="Toni" aria-pressed="${t.resp==='Toni'}"><i class="dot t"></i>Toni</button>
     </div>
     <select class="est" aria-label="Estado">${ESTADOS.map(e=>`<option ${e===t.estado?'selected':''}>${e}</option>`).join('')}</select>
   </div>
   <div class="r-body">
     <div class="grp duo">
       <div><label class="lbl">Título</label>
         <input class="fld" data-k="tarea" value="${escA(t.tarea)}" placeholder="Qué hay que hacer, en una línea"></div>
       <div><label class="lbl">Módulo</label>
         <input class="fld" data-k="modulo" value="${escA(t.modulo)}" placeholder="Leads, Matching, Briefing…"></div>
     </div>
     <div class="grp"><label class="lbl">Explicación</label>
       <textarea class="fld expl" data-k="expl" placeholder="El detalle completo: qué pasa, cuándo, y cómo debería quedar">${esc(t.expl)}</textarea></div>
     <div class="grp duo2">
       <div><label class="lbl">Último comentario</label>
         <textarea class="fld" data-k="com" placeholder="Qué hiciste y qué esperas del otro">${esc(t.com)}</textarea></div>
       <div><label class="lbl">Fecha límite</label>
         <input class="fld" type="date" data-k="fecha" value="${t.fecha||''}"></div>
     </div>
     <div class="grp">
       <label class="lbl">Archivos y capturas</label>
       <div class="zona">
         <span class="zona-txt">Arrastra archivos aquí, pega una captura con <kbd>Ctrl</kbd>+<kbd>V</kbd>, o</span>
         <button class="mini2" type="button" data-pick>Elegir archivos</button>
         <input type="file" multiple hidden data-file>
       </div>
       <input class="fld enl" data-k="img" value="${escA(t.img)}" placeholder="…o pega aquí un enlace de Drive, si prefieres no adjuntar">
       ${/^https?:\/\//.test(t.img)?`<a class="link" href="${escA(t.img)}" target="_blank" rel="noopener">Abrir enlace</a>`:''}
       <div class="thumbs"></div>
     </div>
     <div class="r-foot">
       <div class="mover"><span class="lbl">Bloque</span>
         <select data-mover>${opciones}</select></div>
       <button class="del">Borrar tarea</button>
     </div>
   </div>`;

  row.querySelector('.grip-slot').replaceWith(asa(row,'tarea',t.id,'Arrastra para mover la tarea'));
  row.addEventListener('dragover',e=>{
    if(arrastre?.tipo!=='tarea'||arrastre.id===t.id||llevaArchivos(e)) return;
    e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect='move';
    const r=row.getBoundingClientRect();
    const abajo=e.clientY > r.top + r.height/2;
    limpiarZonas(); row.classList.add(abajo?'dz-b':'dz-a');
  });
  row.addEventListener('drop',e=>{
    if(arrastre?.tipo!=='tarea'||llevaArchivos(e)) return;
    e.preventDefault(); e.stopPropagation();
    const abajo=row.classList.contains('dz-b');
    const id=arrastre.id; limpiarZonas();
    moverTarea(id, t.id, abajo);
  });

  const toggle = e=>{
    if(e.target.closest('.seg,select,.r-body,.grip')) return;
    row.classList.toggle('open');
    row.classList.contains('open') ? abiertas.add(t.id) : abiertas.delete(t.id);
    if(row.classList.contains('open')) row.querySelectorAll('textarea').forEach(autosize);
  };
  row.querySelector('.r-head').onclick = toggle;

  row.querySelectorAll('.seg button').forEach(b=>{
    b.onclick=ev=>{
      ev.stopPropagation();
      const respAnterior=t.resp;
      t.resp=(t.resp===b.dataset.r)?'':b.dataset.r;
      row.dataset.resp=t.resp;
      row.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.r===t.resp));
      persistirTarea(t, { revertir: () => { t.resp=respAnterior; render(); cancha(); } });
      cancha();
      if(filtros.resp!=='todas') render();
    };
  });
  row.querySelector('.est').onchange=e=>{
    const estadoAnterior=t.estado;
    t.estado=e.target.value; row.dataset.estado=t.estado;
    persistirTarea(t, { revertir: () => { t.estado=estadoAnterior; render(); cancha(); actualizarPills(); } });
    cancha(); actualizarPills();
    if(filtros.ocultarHechas) render();
  };
  row.querySelectorAll('[data-k]').forEach(el=>{
    el.oninput=()=>{
      if(!valoresAntesDelCambio.has(t.id)) valoresAntesDelCambio.set(t.id, {...t});
      t[el.dataset.k]=el.value;
      if(el.tagName==='TEXTAREA') autosize(el);
      if(el.dataset.k==='tarea'){
        const ttl=row.querySelector('.r-t');
        ttl.textContent=el.value||'Tarea sin título — ábrela y ponle nombre';
        ttl.classList.toggle('vacio', !el.value);
      }
      guardarDebounced(t.id, () => {
        pendientesEnVuelo.set(t.id, (pendientesEnVuelo.get(t.id)||0)+1);
        persistirTarea(t, {
          revertir: () => {
            const previo = valoresAntesDelCambio.get(t.id);
            if (previo) Object.assign(t, previo);
            render();
          },
        }).then(() => {
          const restantes = (pendientesEnVuelo.get(t.id)||1) - 1;
          if (restantes <= 0 && !pendientesGuardado.has(t.id)) {
            pendientesEnVuelo.delete(t.id); valoresAntesDelCambio.delete(t.id);
          } else pendientesEnVuelo.set(t.id, Math.max(0, restantes));
        });
      });
    };
  });
  const thumbs=row.querySelector('.thumbs'), zona=row.querySelector('.zona');
  const inFile=row.querySelector('[data-file]');
  pintarThumbs(t, thumbs);
  const repinta=()=>{ pintarThumbs(t, thumbs); };
  row.querySelector('[data-pick]').onclick=ev=>{ ev.stopPropagation(); inFile.click(); };
  inFile.onchange=ev=>{ if(ev.target.files.length) adjuntar(t, [...ev.target.files], repinta); ev.target.value=''; };
  ['dragenter','dragover'].forEach(n=>zona.addEventListener(n,e=>{
    if(!llevaArchivos(e)) return;
    e.preventDefault(); e.stopPropagation(); zona.classList.add('drag'); }));
  ['dragleave','drop'].forEach(n=>zona.addEventListener(n,e=>{
    if(!llevaArchivos(e)) return;
    e.preventDefault(); e.stopPropagation(); zona.classList.remove('drag'); }));
  zona.addEventListener('drop',e=>{
    const fs=[...(e.dataTransfer?.files||[])];
    if(fs.length) adjuntar(t, fs, repinta);
  });
  row.querySelector('.r-body').addEventListener('paste',e=>{
    const fs=[...(e.clipboardData?.files||[])].filter(f=>f.size);
    if(!fs.length) return;
    e.preventDefault(); adjuntar(t, fs, repinta);
  });

  row.querySelector('[data-mover]').onchange=e=>{
    const secAnterior=t.sec, ordenAnterior=t.orden;
    t.sec=e.target.value;
    const delSec=estado.tareas.filter(x=>x.sec===t.sec && x.id!==t.id);
    const ultimo=delSec.length ? delSec[delSec.length-1].orden : null;
    t.orden=RoadmapSync.calcularOrden(ultimo, null);
    persistirTarea(t, { revertir: () => { t.sec=secAnterior; t.orden=ordenAnterior; render(); } });
    render();
  };
  const btnDel=row.querySelector('.del');
  btnDel.onclick=async ()=>{
    if(!confirm('Se borra «'+(t.tarea||t.id)+'». ¿Seguir?')) return;
    const idx=estado.tareas.findIndex(x=>x.id===t.id);
    estado.tareas=estado.tareas.filter(x=>x.id!==t.id);
    abiertas.delete(t.id); render();
    await conEstadoDeCarga(async () => {
      for(const f of (t.files||[])){ try{ await RoadmapSync.borrarArchivo(f.path); }catch(e){} }
      await RoadmapSync.borrarTarea(t.id);
    }, {
      onEstado: combinar(onEstadoBoton(btnDel, 'Borrando...'), onEstadoGlobal),
      revertir: () => { estado.tareas.splice(idx,0,t); render(); },
    });
  };
  if(abiertas.has(t.id)) setTimeout(()=>row.querySelectorAll('textarea').forEach(autosize),0);
  return row;
}

function actualizarPills(){
  estado.secciones.forEach(s=>{
    const el=document.querySelector(`.sec[data-id="${s.id}"] .pill`);
    if(!el) return;
    const suyas=estado.tareas.filter(t=>t.sec===s.id);
    el.textContent=suyas.filter(t=>t.estado!=='Hecho').length+' abiertas / '+suyas.length;
  });
}

function pintarSeccion(s){
  const suyas=estado.tareas.filter(t=>t.sec===s.id);
  const vis=suyas.filter(visible);
  const filtrando = filtros.resp!=='todas' || filtros.q || filtros.ocultarHechas;
  if(filtrando && !vis.length) return null;

  const sec=document.createElement('section');
  sec.className='sec'+(cerradas.has(s.id)?'':' open');
  sec.dataset.id=s.id;
  sec.innerHTML=`
    <div class="sec-h">
      <span class="grip-slot"></span>
      <button class="caret" aria-label="Plegar o desplegar bloque">&#9654;</button>
      <input class="sec-name" value="${escA(s.titulo)}" aria-label="Nombre del bloque" placeholder="Nombre del bloque">
      <div class="sec-tools">
        <span class="menu-wrap">
          <button class="tool" data-menu title="Más opciones" aria-haspopup="true" aria-expanded="false">&#8943;</button>
          <div class="menu" hidden role="menu">
            <button data-up role="menuitem">Subir bloque</button>
            <button data-down role="menuitem">Bajar bloque</button>
            <hr>
            <button data-del class="peligro" role="menuitem">Borrar bloque</button>
          </div>
        </span>
      </div>
      <span class="pill">${suyas.filter(t=>t.estado!=='Hecho').length} abiertas / ${suyas.length}</span>
    </div>
    <div class="sec-body"></div>`;

  sec.querySelector('.caret').onclick=()=>{
    sec.classList.toggle('open');
    sec.classList.contains('open')?cerradas.delete(s.id):cerradas.add(s.id);
  };
  const inp=sec.querySelector('.sec-name');
  inp.oninput=()=>{
    if(!valoresAntesDelCambio.has(s.id)) valoresAntesDelCambio.set(s.id, {...s});
    s.titulo=inp.value;
    guardarDebounced(s.id, () => {
      pendientesEnVuelo.set(s.id, (pendientesEnVuelo.get(s.id)||0)+1);
      persistirSeccion(s, {
        revertir: () => {
          const previo = valoresAntesDelCambio.get(s.id);
          if (previo) Object.assign(s, previo);
          render();
        },
      }).then(() => {
        const restantes = (pendientesEnVuelo.get(s.id)||1) - 1;
        if (restantes <= 0 && !pendientesGuardado.has(s.id)) {
          pendientesEnVuelo.delete(s.id); valoresAntesDelCambio.delete(s.id);
        } else pendientesEnVuelo.set(s.id, Math.max(0, restantes));
      });
    });
  };
  inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } };
  const cab=sec.querySelector('.sec-h');
  cab.querySelector('.grip-slot').replaceWith(asa(cab,'bloque',s.id,'Arrastra para mover el bloque'));
  cab.addEventListener('dragover',e=>{
    if(llevaArchivos(e)) return;
    if(arrastre?.tipo==='bloque'&&arrastre.id!==s.id){
      e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect='move';
      const r=cab.getBoundingClientRect();
      limpiarZonas(); sec.classList.add(e.clientY>r.top+r.height/2?'dz-b':'dz-a');
    } else if(arrastre?.tipo==='tarea'){
      e.preventDefault(); e.stopPropagation(); e.dataTransfer.dropEffect='move';
      limpiarZonas(); cab.classList.add('dz-in');
    }
  });
  cab.addEventListener('drop',e=>{
    if(llevaArchivos(e)||!arrastre) return;
    e.preventDefault(); e.stopPropagation();
    const {tipo,id}=arrastre;
    if(tipo==='bloque'){ const abajo=sec.classList.contains('dz-b'); limpiarZonas(); moverBloque(id,s.id,abajo); }
    else { limpiarZonas(); cerradas.delete(s.id); moverTareaAlFinal(id,s.id); }
  });

  /* menú de tres puntos */
  const wrap=sec.querySelector('.menu-wrap'), bm=wrap.querySelector('[data-menu]'), menu=wrap.querySelector('.menu');
  const cerrarMenus=()=>document.querySelectorAll('.menu').forEach(m=>{
    m.hidden=true; m.closest('.sec')?.classList.remove('menu-open');
    m.parentElement.querySelector('[data-menu]').setAttribute('aria-expanded','false');
  });
  bm.onclick=ev=>{
    ev.stopPropagation();
    const abierto=!menu.hidden; cerrarMenus();
    if(!abierto){
      menu.hidden=false; sec.classList.add('menu-open'); bm.setAttribute('aria-expanded','true');
      const i=estado.secciones.findIndex(x=>x.id===s.id);
      menu.querySelector('[data-up]').disabled = i<=0;
      menu.querySelector('[data-down]').disabled = i>=estado.secciones.length-1;
    }
  };
  menu.onclick=ev=>ev.stopPropagation();
  menu.querySelector('[data-up]').onclick=()=>{ cerrarMenus(); moverBloquePaso(s.id,-1); };
  menu.querySelector('[data-down]').onclick=()=>{ cerrarMenus(); moverBloquePaso(s.id,1); };
  const btnDelBloque=sec.querySelector('[data-del]');
  btnDelBloque.onclick=async ()=>{
    cerrarMenus();
    if(suyas.length){ aviso('Ese bloque tiene '+suyas.length+' tareas. Muévelas o bórralas primero.'); return; }
    if(!confirm('Se borra el bloque «'+s.titulo+'». ¿Seguir?')) return;
    const idx=estado.secciones.findIndex(x=>x.id===s.id);
    estado.secciones=estado.secciones.filter(x=>x.id!==s.id); render();
    await conEstadoDeCarga(() => RoadmapSync.borrarSeccion(s.id), {
      onEstado: combinar(onEstadoBoton(btnDelBloque, 'Borrando...'), onEstadoGlobal),
      revertir: () => { estado.secciones.splice(idx,0,s); render(); },
    });
  };

  const body=sec.querySelector('.sec-body');
  body.addEventListener('dragover',e=>{
    if(arrastre?.tipo!=='tarea'||llevaArchivos(e)) return;
    e.preventDefault(); e.dataTransfer.dropEffect='move';
    if(!body.querySelector('.dz-a,.dz-b')){ limpiarZonas(); body.classList.add('dz-in'); }
  });
  body.addEventListener('drop',e=>{
    if(arrastre?.tipo!=='tarea'||llevaArchivos(e)) return;
    e.preventDefault(); const id=arrastre.id; limpiarZonas(); moverTareaAlFinal(id,s.id);
  });
  vis.forEach(t=>body.appendChild(pintarFila(t)));
  if(!vis.length){
    const v=document.createElement('div');
    v.className='empty'; v.style.padding='18px'; v.textContent='Bloque vacío.';
    body.appendChild(v);
  }
  const add=document.createElement('button');
  add.className='addrow'; add.textContent='+  Nueva tarea en este bloque';
  add.onclick=()=>{
    const id=nuevoId('T', estado.tareas.map(x=>x.id));
    const delSec=estado.tareas.filter(x=>x.sec===s.id);
    const ultimo=delSec.length ? delSec[delSec.length-1].orden : null;
    const nueva={id,sec:s.id,modulo:'',tarea:'',expl:'',resp:'',estado:'Pendiente',img:'',com:'',fecha:'',files:[],orden:RoadmapSync.calcularOrden(ultimo,null)};
    estado.tareas.push(nueva);
    abiertas.add(id); cerradas.delete(s.id); render();
    persistirTarea(nueva, {
      revertir: () => { estado.tareas=estado.tareas.filter(x=>x.id!==id); abiertas.delete(id); render(); },
    });
    const el=document.querySelector(`.row[data-id="${id}"] [data-k=tarea]`);
    if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); el.focus(); }
  };
  body.appendChild(add);
  return sec;
}

function render(){
  lista.innerHTML='';
  let n=0;
  estado.secciones.forEach(s=>{
    const el=pintarSeccion(s);
    if(el){ lista.appendChild(el); n+=estado.tareas.filter(t=>t.sec===s.id&&visible(t)).length; }
  });
  if(!estado.secciones.length){
    lista.innerHTML='<div class="empty">No hay bloques. Crea el primero con el botón de abajo.</div>';
  } else if(!n && (filtros.resp!=='todas'||filtros.q||filtros.ocultarHechas)){
    lista.innerHTML='<div class="empty">Ninguna tarea encaja con este filtro. Prueba «Todas» o vacía la búsqueda.</div>';
  }
  visibles.textContent=n+' visibles';
  cancha();
}

/* ---- barra ---- */
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{
    filtros.resp=c.dataset.f;
    document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));
    render();
  };
});
q.oninput=e=>{ filtros.q=e.target.value.trim().toLowerCase(); render(); };
oh.onchange=e=>{ filtros.ocultarHechas=e.target.checked; render(); };
bPlegar.onclick=()=>{
  const algoAbierto = abiertas.size>0 || cerradas.size<estado.secciones.length;
  if(algoAbierto){
    abiertas.clear(); estado.secciones.forEach(s=>cerradas.add(s.id));
    bPlegar.textContent='Desplegar todo';
  }else{
    cerradas.clear(); bPlegar.textContent='Plegar todo';
  }
  render();
};
bNuevoBloque.onclick=()=>{
  const id=nuevoId('s', estado.secciones.map(x=>x.id));
  const ultima=estado.secciones.length ? estado.secciones[estado.secciones.length-1].orden : null;
  const nueva={id,titulo:'',orden:RoadmapSync.calcularOrden(ultima,null)};
  estado.secciones.push(nueva);
  cerradas.delete(id); render();
  persistirSeccion(nueva, {
    revertir: () => { estado.secciones=estado.secciones.filter(x=>x.id!==id); render(); },
  });
  const el=document.querySelector(`.sec[data-id="${id}"] .sec-name`);
  if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); el.focus(); }
};

/* ---- utilidades ---- */
function aviso(txt){
  toast.textContent=txt; toast.classList.add('on');
  clearTimeout(toast._x); toast._x=setTimeout(()=>toast.classList.remove('on'),2800);
}
function bajar(nombre,contenido,tipo){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([contenido],{type:tipo}));
  a.download=nombre; a.click(); URL.revokeObjectURL(a.href);
}
const hoy=()=>new Date().toISOString().slice(0,10);

bHtml.onclick=()=>{
  const tag=document.getElementById('datos'), antes=tag.textContent;
  tag.textContent=JSON.stringify(estado,null,1).replace(/<\//g,'<\\/');
  const copia=lista.innerHTML; lista.innerHTML='';
  const doc='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  lista.innerHTML=copia; tag.textContent=antes;
  bajar('plan-loro-toni-'+hoy()+'.html',doc,'text/html;charset=utf-8');
  aviso('Archivo guardado. Ese es el que le pasas a tu hermano.');
};
bCsv.onclick=()=>{
  const sec={}; estado.secciones.forEach(s=>sec[s.id]=s.titulo);
  const e=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const cab=['ID','Bloque','Modulo','Tarea','Explicacion','Responsable','Estado','Enlace','Archivos adjuntos','Ultimo comentario','Fecha limite'];
  const filas=estado.tareas.map(t=>[t.id,sec[t.sec]||'',t.modulo,t.tarea,t.expl,t.resp,t.estado,t.img,
    (t.files||[]).map(f=>f.n).join(' | '),t.com,t.fecha].map(e).join(';'));
  bajar('plan-loro-toni-'+hoy()+'.csv','\ufeff'+[cab.map(e).join(';'),...filas].join('\r\n'),'text/csv;charset=utf-8');
  aviso('CSV guardado. Se abre en Excel con doble clic.');
};
document.addEventListener('click',()=>document.querySelectorAll('.menu:not([hidden])').forEach(m=>{
  m.hidden=true; m.closest('.sec')?.classList.remove('menu-open');
  m.parentElement.querySelector('[data-menu]').setAttribute('aria-expanded','false');
}));
document.addEventListener('dragend',()=>{ arrastre=null; limpiarZonas(); });
document.addEventListener('keydown',e=>{
  const t=document.activeElement.tagName;
  if(e.key==='Escape'){ document.querySelectorAll('.menu:not([hidden])').forEach(m=>{
    m.hidden=true; m.closest('.sec')?.classList.remove('menu-open');
    m.parentElement.querySelector('[data-menu]').setAttribute('aria-expanded','false'); }); }
  if(e.key==='/' && t!=='INPUT' && t!=='TEXTAREA'){ e.preventDefault(); q.focus(); }
  if(e.key==='Escape' && t!=='INPUT' && t!=='TEXTAREA' && abiertas.size){ abiertas.clear(); render(); }
});

const loginOverlay = document.getElementById('loginOverlay');
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');

function mostrarModalLogin(){ loginOverlay.hidden = false; }
function ocultarModalLogin(){ loginOverlay.hidden = true; }

async function cargarYArrancar(){
  try{
    estado = await RoadmapSync.cargarEstado();
  }catch(e){
    aviso('No se pudo conectar con la base: '+e.message);
    estado = { secciones: [], tareas: [] };
  }
  render();
}

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  loginError.hidden = true;
  const submitBtn = loginForm.querySelector('button[type=submit]');
  const marcar = onEstadoBoton(submitBtn, 'Entrando...');
  marcar('cargando');
  try{
    await RoadmapSync.iniciarSesion(loginEmail.value.trim(), loginPassword.value);
    marcar('ok');
  }catch(err){
    marcar('error');
    loginError.textContent = 'Email o contraseña incorrectos.';
    loginError.hidden = false;
  }
});

bCerrarSesion.onclick = async () => {
  const marcar = onEstadoBoton(bCerrarSesion, 'Saliendo...');
  marcar('cargando');
  try{ await RoadmapSync.cerrarSesion(); marcar('ok'); }
  catch(e){ marcar('error'); aviso('No se pudo cerrar sesión: '+e.message); }
};

(async function iniciar(){
  let activa = false;
  try{ activa = await RoadmapSync.sesionActiva(); }
  catch(e){ aviso('No se pudo verificar la sesión: '+e.message); }
  if(activa){ await cargarYArrancar(); } else { mostrarModalLogin(); }

  RoadmapSync.onCambioSesion(async sesionOk => {
    if(sesionOk){ ocultarModalLogin(); await cargarYArrancar(); }
    else { estado = { secciones: [], tareas: [] }; render(); mostrarModalLogin(); }
  });

  RoadmapSync.suscribir(refrescarDesdeSupabase);
})();
</script>
</body>
